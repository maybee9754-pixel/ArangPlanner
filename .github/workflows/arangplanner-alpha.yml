name: Build ArangPlanner independent alpha
on:
  push:
    branches: [main]
    paths:
      - 'ArangPlanner/ArangPlanner.lua'
      - 'ArangPlanner/UI.lua'
      - 'ArangPlanner/ArangPlanner.toc'
      - 'ArangPlanner/README.md'
      - '.github/workflows/arangplanner-alpha.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Lua syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          luac -p ArangPlanner/ArangPlanner.lua
          luac -p ArangPlanner/UI.lua
      - name: Package allowlisted independent addon files
        run: |
          python3 - <<'PY'
          import pathlib,zipfile,hashlib
          root=pathlib.Path('ArangPlanner')
          paths=['ArangPlanner.toc','ArangPlanner.lua','UI.lua','README.md']
          toc=(root/'ArangPlanner.toc').read_text(encoding='utf-8')
          assert '## Version: 1.1.2-alpha' in toc
          assert '## SavedVariables: ArangPlannerDB' in toc
          assert [x.strip() for x in toc.splitlines() if x.strip().endswith('.lua')]==['ArangPlanner.lua','UI.lua']
          assert all((root/f).is_file() for f in paths)
          for p in (root/'ArangPlanner.lua',root/'UI.lua'):
              content=p.read_text(encoding='utf-8')
              assert 'GearPlannerDB' not in content
              assert 'GearPlanner_Arang' not in content
          target=pathlib.Path('ArangPlanner_v1.1.2-alpha.zip')
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED) as z:
              for f in paths:z.write(root/f,'ArangPlanner/'+f)
          with zipfile.ZipFile(target) as z:
              assert z.testzip() is None
              assert sorted(z.namelist()) == sorted('ArangPlanner/'+x for x in paths)
          digest=hashlib.sha256(target.read_bytes()).hexdigest()
          pathlib.Path(target.name+'.sha256').write_text(digest+'  '+target.name+'\n',encoding='utf-8')
          print('Built',target,'SHA256',digest)
          PY
      - name: Attach build files
        uses: actions/upload-artifact@v4
        with:
          name: ArangPlanner-v1.1.2-alpha
          path: |
            ArangPlanner_v1.1.2-alpha.zip
            ArangPlanner_v1.1.2-alpha.zip.sha256
      - name: Publish initial alpha
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.2-alpha
          name: ArangPlanner v1.1.2-alpha (independent prototype)
          prerelease: false
          draft: false
          body: |
            ArangPlanner specialization target table alpha. Updater v1.0.5 compatible file names.
            It does NOT contain the original GearPlanner copyrighted source.
            Fixes blank goal list after registration, even if item info is uncached. Includes /arang debug command. Retains spec target table, equipped/bag checks and paging.
            NOT feature-equivalent to GearPlanner Arang 1.5. No voidcore tracking or loot history.
            Back up the previous ArangPlanner folder before installing.
            Retain original GearPlanner and its SavedVariables.
          files: |
            ArangPlanner_v1.1.2-alpha.zip
            ArangPlanner_v1.1.2-alpha.zip.sha256
