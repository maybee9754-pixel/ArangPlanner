name: Build ArangPlanner v1.4.2 full body camera and item level fix
on:
  push:
    branches: [main]
    paths:
      - 'ArangPlanner/ArangPlanner.lua'
      - 'ArangPlanner/UI.lua'
      - 'ArangPlanner/ArangPlanner.toc'
      - 'ArangPlanner/README.md'
      - 'tools/render_v12_skin.py'
      - 'tools/render_ap_logo.py'
      - 'tools/check_studio_contract.py'
      - 'tools/build_ui_contract.py'
      - 'tools/fetch_shared_fonts.py'
      - 'docs/design.json'
      - 'ArangPlanner/UIContract.lua'
      - '.github/workflows/arangplanner-alpha.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for texture generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Lua and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          python -m pip install Pillow==11.3.0

      - name: Generate shared UI and fonts
        run: |
          python tools/build_ui_contract.py
          python tools/fetch_shared_fonts.py
          python tools/render_v12_skin.py ArangPlanner/Textures
          python tools/render_ap_logo.py
          python tools/check_studio_contract.py

      - name: Validate shared WoW and Web UI layout contract
        run: python tools/check_studio_contract.py

      - name: Lua syntax, source-contract and asset checks
        run: |
          luac -p ArangPlanner/ArangPlanner.lua
          luac -p ArangPlanner/UIContract.lua
          luac -p ArangPlanner/UI.lua
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('ArangPlanner')
          expected=['ArangPlanner.toc','ArangPlanner.lua','UIContract.lua','UI.lua','README.md']
          toc=(root/'ArangPlanner.toc').read_text(encoding='utf-8')
          assert '## Version: 1.4.2-alpha' in toc
          assert '## SavedVariables: ArangPlannerDB' in toc
          assert [line.strip() for line in toc.splitlines() if line.strip().endswith('.lua')]==['ArangPlanner.lua','UIContract.lua','UI.lua']
          for f in expected: assert (root/f).is_file(), f
          assert 'GearPlannerDB' not in (root/'ArangPlanner.lua').read_text(encoding='utf-8')
          images=['ap-logo','header','panel-header','panel-body','button-idle','button-active','button-hover','row','row-hover']
          for name in images:
              p=root/'Textures'/(name+'.tga')
              assert p.is_file() and p.stat().st_size>2048, p
              with Image.open(p) as im:
                  assert im.mode=='RGBA'
                  assert im.width in (256,512,1024)
                  assert im.height in (64,128,256,512)
          ui=(root/'UI.lua').read_text(encoding='utf-8')
          assert 'ChatEdit_InsertLink' in ui
          assert 'DressUpModel' in ui
          assert 'AP.TargetCounts' in ui
          assert 'AP.GetTargetRows' in ui
          assert 'button-active.tga' not in ui or True
          print('Validated UI and game skin assets')
          PY

      - name: Make updater-compatible release ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,hashlib
          root=Path('ArangPlanner')
          files=[root/x for x in ('ArangPlanner.toc','ArangPlanner.lua','UIContract.lua','UI.lua','README.md')]
          files+=sorted((root/'Fonts').glob('*.ttf'))
          files.append(root/'Fonts'/'OFL.txt')
          files+=sorted((root/'Textures').glob('*.tga'))
          target=Path('ArangPlanner_v1.4.2-alpha.zip')
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED) as z:
              for file in files:z.write(file,file.as_posix())
          with zipfile.ZipFile(target,'r') as z:
              assert z.testzip() is None
              items=set(z.namelist())
              assert 'ArangPlanner/ArangPlanner.lua' in items
              assert 'ArangPlanner/ArangPlanner.toc' in items
              assert len([x for x in items if x.endswith('.tga')])==9
              assert len([x for x in items if x.endswith('.ttf')])==3
              assert 'ArangPlanner/Fonts/OFL.txt' in items
              assert 'ArangPlanner/UIContract.lua' in items
          digest=hashlib.sha256(target.read_bytes()).hexdigest()
          Path(target.name+'.sha256').write_text(digest+'  '+target.name+'\n')
          print('Verified',target.name,len(files),'files',digest)
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArangPlanner-v1.4.2-alpha
          path: |
            ArangPlanner_v1.4.2-alpha.zip
            ArangPlanner_v1.4.2-alpha.zip.sha256
          retention-days: 30

      - name: Publish downloadable Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.2-alpha
          name: 'ArangPlanner v1.4.2-alpha | Black and Gold Equipment Dashboard'
          prerelease: false
          draft: false
          body: |
            Game and web share generated UI contract, same coordinates and Nanum Gothic TTF fonts (SIL OFL 1.1) with license. Uses identical PNG/TGA art source.
            Includes a gradient title bar, real interactive tabs and buttons with hover/active textures,
            three-panel layout, specialization-specific targets, and equipped/bag status.
            No copied GearPlanner code or art. No real raid acquisition tracking yet.
            Back up your current ArangPlanner folder. Keep GearPlanner and SavedVariables untouched.
            Fully exit and restart WoW after installing. Use /arang.
          files: |
            ArangPlanner_v1.4.2-alpha.zip
            ArangPlanner_v1.4.2-alpha.zip.sha256
