name: Deploy Arang Planner Studio (GitHub Pages)
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/render_v12_skin.py'
      - 'tools/check_studio_contract.py'
      - 'tools/build_ui_contract.py'
      - 'tools/fetch_shared_fonts.py'
      - 'ArangPlanner/UI.lua'
      - 'ArangPlanner/UI.lua'
      - 'ArangPlanner/ArangPlanner.toc'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Setup Python for shared texture generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate both UI contracts and matching OFL fonts
        run: |
          python tools/build_ui_contract.py
          python tools/fetch_shared_fonts.py
          python tools/check_studio_contract.py
      - name: Generate matching game/web PNG assets
        run: |
          python -m pip install Pillow==11.3.0
          python tools/render_v12_skin.py docs/assets
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
