name: Deploy Arang Planner Studio (GitHub Pages)
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/render_v12_skin.py'
      - 'tools/build_ui_contract.py'
      - 'tools/fetch_shared_fonts.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image renderer
        run: python -m pip install Pillow==11.3.0
      - name: Generate preview CSS and PNG images
        run: |
          python tools/build_ui_contract.py
          python tools/render_v12_skin.py docs/assets
      - name: Try to include matching Korean fonts
        id: fonts
        continue-on-error: true
        run: python tools/fetch_shared_fonts.py
      - name: Validate actual Pages artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path("docs")
          data=json.loads((base/"design.json").read_text(encoding="utf-8"))
          index=(base/"index.html").read_text(encoding="utf-8")
          preview=(base/"preview-r4.html").read_text(encoding="utf-8")
          css=(base/"ui-contract.css").read_text(encoding="utf-8")
          assert data["revision"]=="arangplanner-v1.3.0-alpha-pixel-match-r11"
          assert "R8 새 페이지 로드됨" in preview
          assert "live.textContent=css" in preview
          assert "live.textContent=css" in index
          assert "ui-contract.css?v=1.3.0-r11-pixel-match" in index
          assert ".panel{background-image:linear-gradient(rgba(0,0,0,0.21)" in css, "r7 panel calibration missing"
          assert ".center .tableline{background-image:linear-gradient(rgba(0,0,0,0.16)" in css, "r7 row calibration missing"
          assert ".canvas .footer-game{color:#9996AD !important;bottom:6px" in css, "r5 footer/typography missing"
          assert ".panel.left .stat .rose{color:#9CC9C4 !important" in css, "game status text color missing"
          assert ".section{position:relative !important;top:1px" in css, "r4 heading correction missing"
          assert ".center .tablehead>span{color:#FFD100" in css, "game gold loot header missing"
          assert ".center .tableline .id{color:#B3ADBF" in css, "game item-id text missing"
          assert "demo-item-271510.webp" in index and "demo-item-271511.webp" in index
          assert "game-item-icon" in css
          for name in ("271510","271511"):
              assert (base/"assets"/("demo-item-"+name+".webp")).stat().st_size>400, name
          assert ".canvas{border:0 !important;outline:1px" in css, "1px origin correction missing"
          assert ".head .identity .diamond{width:21px" in css, "WoW logo geometry missing"
          assert ".section{font-size:13px" in css, "game panel heading font mismatch"
          assert ".canvas .footer-game{bottom:2px" in css, "footer baseline correction missing"
          assert "rgba(0,0,70,0.04)" in css, "panel RGB pixel calibration missing"
          assert "rgba(57,36,99,0.05)" in css, "section RGB pixel calibration missing"
          assert ".head{background-image:linear-gradient(180deg,#0e0c16" in css, "game header tone mismatch"
          assert ".surface.panel{background-image:linear-gradient(180deg,#0c0b14" in css, "panel background tone mismatch"
          assert ".center .tablehead{background-image:none" in css, "dark game table header mismatch"
          assert ".center #itemInput{background:#06060e" in css, "game input fill mismatch"
          assert ".center .tableline{background-image:linear-gradient(rgba(0,0,0,0.07)" in css, "row brightness mismatch"
          assert data["previewCalibration"]["fullPass"]["measurements"]["inputFill"]["game"]==[6,6,14]
          assert ".center .tablehead{background-color:#0e0c14" in css, "r11 table heading color mismatch"
          assert ".center .tableline{background-image:linear-gradient(rgba(0,0,38,0.11)" in css, "r11 rows not regenerated"
          assert ".canvas .footer-game{color:#878398" in css, "r11 footer contrast mismatch"
          assert data["previewCalibration"]["r11"]["currentRegionalMedians"]["panel"]["game"] == [12,11,19]
          names=("header","panel-body","panel-header","row","row-hover","button-idle","button-active","button-hover")
          for name in names:
              assert (base/"assets"/(name+".png")).stat().st_size>100, name
          for filename in ("index.html","preview-r4.html","design.json","ui-contract.css"):
              print("Publishing",filename, (base/filename).stat().st_size, "bytes")
          print("READY TO DEPLOY",data["revision"])
          PY
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
