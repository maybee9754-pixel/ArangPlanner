name: Build and publish ArangPlanner

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (example: 0.5.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate folder and version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version"; exit 1; }
          test -f ArangPlanner/ArangPlanner.toc
          test -f ArangPlanner/ArangPlanner.lua
          grep -q '^## Version:' ArangPlanner/ArangPlanner.toc
          ! find ArangPlanner -type f | grep -Ei '(^|/)(WTF|SavedVariables)/|\.(exe|ps1|bat|cmd)$'
      - name: Package addon
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, zipfile
          version=os.environ["VERSION"]
          target=pathlib.Path("ArangPlanner_v"+version+".zip")
          root=pathlib.Path("ArangPlanner")
          with zipfile.ZipFile(target,"w",zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob("*")):
                  if p.is_file(): z.write(p,p.as_posix())
          with zipfile.ZipFile(target) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert "ArangPlanner/ArangPlanner.toc" in names
              assert "ArangPlanner/ArangPlanner.lua" in names
          print(target)
          PY
          sha256sum ArangPlanner_v"$VERSION".zip > ArangPlanner_v"$VERSION".zip.sha256
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: ArangPlanner v${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            ArangPlanner_v${{ inputs.version }}.zip
            ArangPlanner_v${{ inputs.version }}.zip.sha256
